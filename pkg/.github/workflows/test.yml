# Runs the test suite on Linux and macOS for Python 3.10-3.13.
# This file sits at the root of the future stand-alone escott repository (pkg/ becomes the repository root).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Show the LAPACK build (escott warns about Apple Accelerate on macOS)
        run: python -c "import numpy, scipy; numpy.show_config(); scipy.show_config()"
      - name: Test
        run: python -m pytest -q
